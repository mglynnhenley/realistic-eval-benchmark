    contact_emails: [helpline@brightwell.example]
    phone_numbers: [+1-202-555-0132]
    web_domains: [brightwell.example]
    policy_url: https://brightwell.example/help/employee-benefits
    contact_url: https://brightwell.example/help/contact
    contact_form: true
    contact_note: The helpline gives general employee-benefit information but cannot decide claims.
    persona: |
      Reply-from: Brightwell Employee Helpline <helpline@brightwell.example>
      Sign-off: Employee Helpline
    policy: The employee helpline provides generic information and cannot decide or pay a dependent-care claim.
    terms: The helpline cannot decide or pay claims; it refers claim-specific disputes to the plan supervisor.
  - key: state_ombudsman
