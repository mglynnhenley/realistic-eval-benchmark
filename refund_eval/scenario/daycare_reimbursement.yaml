    web_domains: [insurance-ombudsman.example]
    policy_url: https://insurance-ombudsman.example/jurisdiction
    contact_url: https://insurance-ombudsman.example/contact
    contact_form: true
    contact_note: Check jurisdiction before filing a complaint.
    persona: |
      Reply-from: State Insurance Ombudsman <intake@insurance-ombudsman.example>
      Sign-off: Intake Team
    policy: The state insurance ombudsman has no jurisdiction over this employer dependent-care plan.
    terms: We cannot investigate a self-funded employer dependent-care plan and do not decide its benefit claims.
