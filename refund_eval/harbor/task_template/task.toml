schema_version = "1.4"

# Grading evidence. Harbor restores each artifact at its source path in the separate verifier.
# - world/: from the world sidecar, not `main`: state.json, events.jsonl, seed.json, browser/
#   and the final admin snapshot written by the collect hook below.
# - agent-eval/: the agent's single Inspect .eval log, for Scout. The verifier grades every key
#   from the world's records without it; when present it only adds the crosscheck.* keys.
artifacts = [
    { source = "/var/log/world", service = "world", destination = "world" },
    { source = "/logs/agent/inspect", destination = "agent-eval" },
]

[task]
name = "__TASK_NAME__"
description = "__DESCRIPTION__"
keywords = ["refund-eval", "long-horizon", "customer-service", "__SCENARIO__", "__TASK_ID__"]

[metadata]
task_version = "__TASK_VERSION__"
environment_version = "__ENVIRONMENT_VERSION__"
environment_fingerprint = "__ENVIRONMENT_FINGERPRINT__"
task_id = "__TASK_ID__"
scenario = "__SCENARIO__"
data_mode = "__DATA_MODE__"
sim_weeks = __SIM_WEEKS__
requested_deadline = "__REQUESTED_DEADLINE__"
max_turns = __MAX_TURNS__
research_mode = "__RESEARCH_MODE__"
simulator_model = "__SIMULATOR_MODEL__"
grader_model = "__GRADER_MODEL__"
openrouter_key_mode = "__OPENROUTER_KEY_MODE__"
usage_reporting_mode = "__USAGE_REPORTING_MODE__"
shared_allowance_usd = "__SHARED_ALLOWANCE_USD__"
rules_sha256 = "__RULES_SHA256__"
source_sha256 = "__SOURCE_SHA256__"
agent_wheel_filename = "__AGENT_WHEEL_FILENAME__"
agent_wheel_sha256 = "__AGENT_WHEEL_SHA256__"
seed_policy = __SEED_POLICY__
browser_containment = "unshare -rn in the world container (seccomp=unconfined there only); recorded as unverified where user namespaces are refused"

[verifier]
timeout_sec = __VERIFIER_TIMEOUT__
environment_mode = "separate"

# After the agent phase (main stopped): flush and snapshot the world through its admin port.
[[verifier.collect]]
service = "world"
command = "curl -sf -X POST -H \"Authorization: Bearer $WORLD_ADMIN_TOKEN\" -H 'Content-Type: application/json' -d '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"snapshot\"}' -o /var/log/world/final_snapshot.json http://127.0.0.1:9000/agentenv"
timeout_sec = 120.0

[agent]
timeout_sec = __AGENT_TIMEOUT__

[environment]
build_timeout_sec = 1800.0
cpus = __CPUS__
memory_mb = __MEMORY_MB__
network_mode = "public"
workdir = "/app"

[environment.env]
WORLD_TASK_ID = "__SUITE_TASK_ID__"
WORLD_SCENARIO = "__SCENARIO__"
WORLD_SIM_WEEKS = "__SIM_WEEKS__"
WORLD_DATA_MODE = "__DATA_MODE__"
WORLD_TURN_TOKEN = "${WORLD_TURN_TOKEN:-__TURN_TOKEN__}"
REFUND_EVAL_SHARED_ROLE_MODE = "__SHARED_ROLE_MODE__"
REFUND_EVAL_SHARED_ROLE_BUDGET_CONFIG = __SHARED_ROLE_BUDGET_CONFIG_TOML__

# For discoverability; the installed agent connects to it through Inspect, not Harbor.
[[environment.mcp_servers]]
name = "world"
transport = "streamable-http"
url = "http://world:8000/mcp"
