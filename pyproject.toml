[project]
name = "refund-eval"
version = "0.1.0"
description = "Step 1: the impossible refund. A behaviour eval for personal agents on a long-horizon, impossible task."
requires-python = ">=3.12"
dependencies = [
    "inspect-ai",
    "inspect-scout",
    "openai",
    "httpx",
    "aiohttp",
    "jsonschema>=4",
    "beautifulsoup4",
    "pydantic>=2",
    "pyyaml",
    "google-api-python-client",
    "google-auth-oauthlib",
]

[project.optional-dependencies]
providers = ["anthropic", "google-genai", "xai-sdk"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["refund_eval"]

[tool.hatch.build.targets.wheel.force-include]
"tests/fixtures/inbox.json" = "refund_eval/data/inbox.json"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "browser: real Chromium smoke (set REFUND_EVAL_BROWSER_SMOKE=1; see docs/published-tools.md)",
    "hybrid: real keyless Exa and public-web smoke (set REFUND_EVAL_HYBRID_SMOKE=1)",
    "harbor: Harbor runner integration (run through scripts/harbor)",
]
