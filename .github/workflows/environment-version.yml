name: Environment version

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  environment-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync --frozen
      - run: uv run --frozen pytest -q tests/test_environment_version.py
