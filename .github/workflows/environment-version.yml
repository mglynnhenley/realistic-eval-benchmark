name: Environment version

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  environment-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync --frozen
      - run: uv run --frozen pytest -q tests/test_environment_version.py

  harbor-wheel-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync --frozen --project integrations/harbor
      - run: scripts/harbor python -m pytest -q tests/test_harbor_wheel_install.py
      - run: uv sync --frozen --no-dev
      - run: scripts/harbor python -m pytest -q tests/test_harbor_prepare_trial.py
        env:
          UV_OFFLINE: "1"
          UV_PYTHON_DOWNLOADS: never
          PYTHON_DOTENV_DISABLED: "1"
